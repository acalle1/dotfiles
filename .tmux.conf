# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0
 
# Increase scrollback buffer
set -g history-limit 50000

# Truecolor support (Ghostty supports this)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Enable focus events for vim autoread
set-option -g focus-events on

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Better pane splitting (and keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# mouse support
set -g mouse on

# Switch panes with prefix + arrow
bind Up select-pane -U
bind Down select-pane -D
bind Left select-pane -L
bind Right select-pane -R

# Resize panes with prefix + Ctrl+arrow (repeatable)
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5

# start from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Stay in copy mode after mouse drag
unbind -T copy-mode-vi MouseDragEnd1Pane


# Status bar position
set -g status-position top
 
# Status bar colors
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left-length 20
set -g status-right-length 50
 
# Status bar content
set -g status-left '#[fg=#ff3333,bold] #S #[fg=#30363d]│ '
set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '
 
# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#ff3333,bold] #I:#W '
 
# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#ff3333'
 
# Pane scrollbars — show scrollback position (tmux 3.6+)
set -g pane-scrollbars on
set -g pane-scrollbars-position right
 
# Message styling
set -g message-style 'bg=#ff3333 fg=#000000 bold'
