# Prefix (C-b is the default; explicit for clarity)
unbind C-Space
set -g prefix C-b
bind C-b send-prefix

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Truecolor support (Ghostty supports this)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Forward the Kitty/extended keyboard protocol so apps inside tmux (e.g.
# Claude Code) can distinguish Ctrl+Enter, Shift+Enter, etc. from plain Enter
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Enable focus events for vim autoread
set-option -g focus-events on

# Sync tmux copy-mode yanks with the system clipboard
set -g set-clipboard on

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Splits with default keys, keeping current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Start from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Seamless Ctrl-h/j/k/l navigation between tmux panes and nvim splits
# (nvim side handled by vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Vim copy mode (prefix+[ to enter, default)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Stay in copy mode after mouse drag
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status bar position
set -g status-position top

# Status bar colors (TokyoNight)
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left-length 20
set -g status-right-length 50

# Status bar content
set -g status-left '#[fg=#7aa2f7,bold] #S #[fg=#30363d]│ '
set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#7aa2f7,bold] #I:#W '

# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#7aa2f7'

# Message styling
set -g message-style 'bg=#3b4261 fg=#7aa2f7 bold'
