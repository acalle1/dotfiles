# Prefix (C-b is the default; explicit for clarity)
unbind C-Space
set -g prefix C-b
bind C-b send-prefix

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0

# Increase scrollback buffer
set -g history-limit 50000

# Truecolor support (Ghostty supports this)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# Forward the Kitty/extended keyboard protocol so apps inside tmux (e.g.
# Claude Code) can distinguish Ctrl+Enter, Shift+Enter, etc. from plain Enter
set -g extended-keys always
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Enable focus events for vim autoread
set-option -g focus-events on

# Sync tmux copy-mode yanks with the system clipboard
set -g set-clipboard on

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Splits with default keys, keeping current path
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Start from 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Vim copy mode (prefix+[ to enter, default)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# Stay in copy mode after mouse drag
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status bar position
set -g status-position top

# Status bar colors (TokyoNight)
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left-length 20
set -g status-right-length 50

# Status bar content
set -g status-left '#[fg=#7aa2f7,bold] #S #[fg=#30363d]│ '
set -g status-right '#[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#7aa2f7,bold] #I:#W '

# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#7aa2f7'

# Message styling
set -g message-style 'bg=#3b4261 fg=#7aa2f7 bold'

# ── Plugins (TPM) ────────────────────────────────────────────────
# Auto-install TPM on first run so a fresh dotfiles checkout just works
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'

# prefix + u  →  fzf picker of every URL found in the last N lines of the pane
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-history-limit '2000'   # the "N": how many scrollback lines to scan
set -g @fzf-url-fzf-options '-w 50% -h 50% --multi --no-preview'

# Keep this the VERY LAST line of the file
run '~/.tmux/plugins/tpm/tpm'
